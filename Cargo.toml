[package]
name = "zzview"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Hacker News browser with live feed"
license = "MIT"

[dependencies]
iced = "=0.12.1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
